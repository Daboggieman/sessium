name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir "sessium-${TAG}"
          cp -r linux windows docs completions tests install.sh \
             setup-ubuntu.sh README.md SPEC.md "sessium-${TAG}/"
          tar czf "sessium-${TAG}-linux.tar.gz" "sessium-${TAG}"
          zip -qr "sessium-${TAG}-windows.zip" "sessium-${TAG}"
          sha256sum "sessium-${TAG}-linux.tar.gz" \
                    "sessium-${TAG}-windows.zip" > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "sessium-${GITHUB_REF_NAME}-linux.tar.gz" \
            "sessium-${GITHUB_REF_NAME}-windows.zip" \
            checksums.txt
